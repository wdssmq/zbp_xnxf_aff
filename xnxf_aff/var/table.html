<div class="aff-form">
  <!-- <p class="clearfix"><span class="aff-ver pull-right"><a href="{loginURL}" title="登录">登录</a> 或 <a class="login-a" href="{regURL}" title="注册">注册</a></span></p> -->
  <!-- geetest -->
  {geetest}
  <p>{tip}</p>
  <p><input class="aff-input" id="aff-link" name="aff-link" onchange="this.value='{link}'" type="text" value="{link}"
      onmouseover="this.select();" onclick="that = this;setTimeout(function(){that.select()},150);"> <input
      class="aff-btn" value="复制" title="复制" type="button" data-clipboard-target="#aff-link"></p>
  <p><textarea class="aff-input" id="aff-copy" name="aff-copy" onmouseover="this.select();">{copy}</textarea> <input
      class="aff-btn" value="复制" title="复制" type="button" data-clipboard-target="#aff-copy"></p>
  <!-- geetest-tip -->
  <p>{geetest-tip}</p>
  <p>请保持当前IP：<span class="aff-ip">{ip}</span>；</p>
  <p>有效期至：{time}； 点击：{click}</p>
  <!-- <p>{ua}</p> -->
</div>
